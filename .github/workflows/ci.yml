name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    env:
      # The guest runs Claude Code, which is unfree.
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: microvm-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          # microvm: upstream microvm.nix's QEMU variant; systemstart: agent-vm's
          # earlier cache, until microvm-tools has caught up.
          extraPullNames: microvm,systemstart
      # sandbox (a NixOS VM test; the runner has KVM), wrapper and guest.
      - run: nix flake check --impure -L
      # The whole runner: the audit guest on top of agent-vm.
      - run: nix build --impure .#default
